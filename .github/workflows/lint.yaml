name: Lint

on:
  # `edited` is not one of the default activity types — GitHub runs a workflow
  # on `opened`, `synchronize` and `reopened` only — and without it the title
  # check below is worse than nothing: a title corrected at review time, which
  # is the common case because the title is what release-please reads, leaves
  # the stale green `Lint` standing and the ruleset satisfied.
  #
  # It costs a full re-run of this job on every title or body edit.
  pull_request:
    types:
      - edited
      - opened
      - reopened
      - synchronize
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      # Before the install, so a broken workflow fails in a few seconds rather
      # than after npm ci. It is also a step of this job rather than a job of
      # its own, because Lint is a check the ruleset requires and a new job
      # would be a new name nothing requires — free to fail without stopping
      # anything.
      - name: Run actionlint
        uses: kanso-labs/github-actions/actions/lint-workflows@v3.3.1

      - name: Set up Node
        uses: kanso-labs/github-actions/actions/setup-node@v3.3.1
        with:
          ignore-scripts: true

      - name: Run lint
        run: npm run lint

      # commitlint is installed, configured and working, and nothing invoked it.
      # A `commit-msg` hook would validate the wrong strings: branch commits are
      # discarded by the squash and never reach history, so the pull request
      # title is release-please's single input — the string deciding whether a
      # release is cut at all, and whether it is a minor or a patch. No git hook
      # can see it.
      #
      # The title goes through `env` rather than `${{ }}`, because interpolating
      # it into the script is a command-injection sink: a title can contain
      # anything, and actionlint flags the interpolated form.
      #
      # A step of this job rather than a job of its own, for the same reason
      # actionlint is: the ruleset requires `Build`, `Lint` and `Test` by exact
      # string, and a new job would be a name nothing requires.
      - name: Check the pull request title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s' "$PR_TITLE" | npx commitlint
