name: Lint

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      # Before the install, so a broken workflow fails in a few seconds rather
      # than after npm ci. It is also a step of this job rather than a job of
      # its own, because Lint is a check the ruleset requires and a new job
      # would be a new name nothing requires — free to fail without stopping
      # anything.
      - name: Run actionlint
        uses: kanso-labs/github-actions/actions/lint-workflows@v3.0.2

      # Also before the install, and a step of this job for the same reason as
      # actionlint above. It compares the AGENTS.md paragraphs marked
      # `<!-- shared:… -->` against the canonical copies in github-actions, so
      # editing one of them here alone fails Lint rather than quietly leaving
      # this repository's copy saying something the others do not.
      - name: Check shared documentation blocks
        uses: kanso-labs/github-actions/actions/check-shared-docs@v3.1.0

      - name: Set up Node
        uses: kanso-labs/github-actions/actions/setup-node@v3.0.2
        with:
          ignore-scripts: true

      - name: Run lint
        run: npm run lint
