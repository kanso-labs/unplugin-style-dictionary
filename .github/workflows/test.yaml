name: Test

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  code-quality: write
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      # Nothing these tests need comes from a lifecycle script — they drive the
      # Vite target against real files in a temporary directory.
      - name: Set up Node
        uses: kanso-labs/github-actions/actions/setup-node@v3.3.1
        with:
          ignore-scripts: true

      - name: Run tests
        run: npm run test:coverage

      # The floor in `engines.node`, exercised rather than asserted. Language
      # drift is already caught — `tsconfig.lib.json` pins `lib: ["ES2022"]`,
      # so a newer syntax or global is a compile error. What gets through is a
      # Node API that @types/node declares and an older runtime does not have:
      # `module.stripTypeScriptTypes` type-checks and is `undefined` on 22.12.
      #
      # A second step inside this job rather than a matrix or a job of its own.
      # A matrix would append its value to the check name — this repository's
      # CodeQL job reports as `Analyze (actions)` and
      # `Analyze (javascript-typescript)` for exactly that reason — and ruleset
      # 19123565 requires `Test` by exact string, so the required check would
      # never arrive and the pull request would read as hanging. A separate job
      # fails the other way: a name nothing requires is free to go red without
      # stopping a merge.
      - name: Set up Node on the supported floor
        uses: kanso-labs/github-actions/actions/setup-node@v3.3.1
        with:
          ignore-scripts: true
          node-version-file: .github/node-version-floor

      # Coverage is not re-measured here, so this leg runs `npm test` rather
      # than `npm run test:coverage`. The thresholds are pinned against a
      # single measurement, and the report uploaded below is the one already
      # written by the step above — nothing after this point reads node_modules
      # or the version of Node on PATH.
      - name: Run tests on the supported floor
        run: npm test

      # fail-on-error is false for the same reason fail_ci_if_error is below.
      # The action defaults it to true and waits up to 160 seconds for a
      # service GitHub ships as public preview to process the report, then
      # fails the step if the upload errored, if processing came back failed,
      # or if it never reached a terminal status. `Test` is one of the three
      # checks ruleset 19123565 requires by exact string, so that default puts
      # every merge behind an upload — with the test result already known and
      # green.
      #
      # The failure is still reported: the action emits its `::error`
      # annotation either way, and only the step's exit code changes. Measured
      # against the pinned v1.4.2 with a rejected upload — exit 1 becomes exit
      # 0 and the annotation is byte-identical.
      #
      # It covers the outage class and nothing else. A missing report and an
      # invalid input return 1 before `fail_on_error` is read at all, so a
      # workflow broken by an edit here still fails loudly.
      #
      # The wait itself is left at its default. It costs time on a bad day and
      # buys confirmation that the report processed on every other one, and
      # with the step no longer able to fail the job there is nothing left for
      # it to take down.
      - name: Upload coverage report
        uses: actions/upload-code-coverage@v1.4.2
        with:
          fail-on-error: false
          file: coverage/cobertura-coverage.xml
          label: code-coverage/vitest
          language: TypeScript

      # A second destination for the report the first leg wrote, not a
      # replacement for the step above: that one reports the number on the pull
      # request, this one is what keeps the history the trend lines are drawn
      # from. Neither re-measures, so both read the same file.
      #
      # disable_search is what confines the upload to that one file. The action
      # otherwise walks the workspace for anything shaped like a coverage
      # report, which here can only find the file already named above.
      #
      # fail_ci_if_error is left at its default of false. Test already fails on
      # a coverage drop, through the thresholds in vite.config.ts, and a
      # Codecov outage is not that — it is an upload that did not land, and it
      # should not take a passing run down with it.
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7.1.1
        with:
          disable_search: true
          files: coverage/cobertura-coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}

      # The test results themselves, which is a different report from the
      # coverage one above: Codecov reads it for which tests failed and which
      # are flaky, not for a percentage. `report_type` is what says which of
      # the two this upload is; the default is coverage.
      #
      # The same action as above rather than `codecov/test-results-action`,
      # which Codecov's own docs still point at. That one prints "This action
      # is being deprecated in favor of 'codecov-action'" on every run, and
      # this is the replacement it names — so one pinned action covers both
      # reports and Renovate has one bump to open rather than two.
      #
      # `!cancelled()` is what makes this the one step that runs when the suite
      # fails, and it is the whole point — a run with nothing red has no failed
      # tests to describe. A failing first leg skips the floor legs beneath it,
      # so the file reaching Codecov is that leg's.
      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7.1.1
        with:
          disable_search: true
          files: .vitest/test-results.junit.xml
          report_type: test_results
          token: ${{ secrets.CODECOV_TOKEN }}

  # Windows is a supported platform for contributors even though nothing here
  # deploys to it, and two defects reached `main` unnoticed because no job ran
  # there — an atomic write that inverted (#306) and a watch negation that
  # never matched (#307). Both were found by a one-off experiment rather than
  # by CI, which is the gap this closes.
  #
  # Ruleset 19123565 requires `Build`, `Lint` and `Test` by exact string, so
  # this name is not required and cannot block a merge on its own. Adding it to
  # the ruleset is a repository-settings change and is deliberately separate
  # from adding the job.
  #
  # The suite only, not coverage: the thresholds are measured against one
  # platform and a second set of numbers would fail on run-to-run difference
  # rather than on a regression.
  test-windows:
    name: Test on Windows
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Node
        uses: kanso-labs/github-actions/actions/setup-node@v3.3.1
        with:
          ignore-scripts: true

      - name: Run tests
        run: npm test

      # TEMPORARY — the #307 diagnostic, removed once it has answered.
      - name: Report what the watcher matches on Windows
        if: ${{ !cancelled() }}
        run: npx vitest run tests/windows-probe.test.ts --reporter=verbose
