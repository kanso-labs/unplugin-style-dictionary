name: Test

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  code-quality: write
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      # Nothing these tests need comes from a lifecycle script — they drive the
      # Vite target against real files in a temporary directory.
      - name: Set up Node
        uses: kanso-labs/github-actions/actions/setup-node@v3.2.1
        with:
          ignore-scripts: true

      - name: Run tests
        run: npm run test:coverage

      - name: Upload coverage report
        uses: actions/upload-code-coverage@v1.4.2
        with:
          file: coverage/cobertura-coverage.xml
          label: code-coverage/vitest
          language: TypeScript
