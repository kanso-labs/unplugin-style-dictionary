name: Test

on: pull_request

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Node
        uses: kanso-labs/github-actions/actions/setup-node@v1.2.0

      - name: Run tests
        run: npm run test
