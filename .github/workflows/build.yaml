name: Build

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      # Skips the prepare script, which only installs husky's git hooks. A
      # runner has no commits to hook, so it is pure install time here.
      - name: Set up Node
        uses: kanso-labs/actions/setup-node@v4.0.2
        with:
          ignore-scripts: true

      # CODECOV_TOKEN is what switches the bundle-analysis plugin on — see the
      # comment beside it in tsdown.config.ts. It is an organisation secret, so
      # a pull request from a fork gets an empty string here and the build runs
      # without the analysis rather than failing for want of a secret it was
      # never going to be given.
      - name: Run build
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: npm run build

      # publint reads package.json and the packed file list, so it catches an
      # exports target that points at a file the tarball does not carry —
      # every condition names `.js`, and a build that loses
      # `fixedExtension: false` emits `.mjs`. check-package.mjs covers the two
      # failures it reports as "All good!" — the comment at the top of that
      # script says which and why.
      - name: Verify the published package shape
        run: npm run package:check

      # `package.json` declares five peer ranges and nothing stood behind any
      # of them. `tests/targets.test.ts` drives all five bundlers, which covers
      # the adapters, but only against the single version `devDependencies`
      # pins — it cannot see a range end going stale.
      #
      # This packs the tarball and installs it into throwaway fixtures at each
      # end, so what is exercised is the published file list resolved through
      # the exports map rather than the working tree.
      #
      # A step of this job rather than a job of its own, for the same reason
      # `package:check` is one: the ruleset requires its checks by exact job
      # name, and a new job would be a name nothing requires. It needs the
      # build, so it comes after it.
      - name: Smoke-test both ends of every peer range
        run: npm run peers:check
