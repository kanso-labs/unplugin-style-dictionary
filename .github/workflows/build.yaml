name: Build

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      # Skips the prepare script, which only installs husky's git hooks. A
      # runner has no commits to hook, so it is pure install time here.
      - name: Set up Node
        uses: kanso-labs/github-actions/actions/setup-node@v2.1.0
        with:
          ignore-scripts: true

      - name: Run build
        run: npm run build
