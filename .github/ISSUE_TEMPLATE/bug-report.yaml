name: Bug report
description: Something this plugin does is wrong
labels:
  - kind:fix
body:
  - type: markdown
    attributes:
      value: |
        Please search the
        [issue tracker](https://github.com/kanso-labs/unplugin-style-dictionary/issues)
        first — your issue may already be reported.

        **To report a security vulnerability, do not use this form.** See
        [SECURITY.md](https://github.com/kanso-labs/unplugin-style-dictionary/blob/main/SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected, and what happened instead.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: >-
        The smallest set of steps that shows it. A repository we can clone is
        worth more than a description.
    validations:
      required: true

  # The three below are what a report cannot be placed without. This package
  # targets five bundlers from one implementation and declares a peer range for
  # each, so which bundler, which Style Dictionary and which Node is the
  # difference between a reproducible report and a guess.
  - type: dropdown
    id: bundler
    attributes:
      label: Which bundler
      options:
        - Vite
        - Rollup
        - Rolldown
        - Rspack
        - Webpack
        - More than one
    validations:
      required: true

  - type: input
    id: bundler-version
    attributes:
      label: Bundler version
      description: The exact version, not the range in your package.json.
      placeholder: e.g. vite 8.3.0
    validations:
      required: true

  - type: input
    id: style-dictionary-version
    attributes:
      label: style-dictionary version
      placeholder: e.g. 5.5.3
    validations:
      required: true

  - type: input
    id: node-version
    attributes:
      label: Node version
      description: The output of `node --version`.
      placeholder: e.g. v24.21.0
    validations:
      required: true

  - type: input
    id: plugin-version
    attributes:
      label: Plugin version
      placeholder: e.g. 0.9.0
    validations:
      required: true

  - type: textarea
    id: config
    attributes:
      label: Your plugin options and Style Dictionary config
      description: >-
        How you call the plugin, and the configuration it compiles. Redact
        anything private.
      render: typescript

  - type: textarea
    id: logs
    attributes:
      label: Output
      description: >-
        What the build printed. The plugin reports a failed compile at every one
        of its own log levels, but it hands its messages to the bundler — so a
        host you have silenced (`vite --logLevel silent`) can swallow them.
      render: shell
