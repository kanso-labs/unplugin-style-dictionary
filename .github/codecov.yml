# Codecov looks for this file under the name codecov.yml or .codecov.yml, in
# the repository root, dev/ or .github/, and nowhere else. The .yaml spelling
# every other YAML file in this repository uses is not one it recognises, so
# this filename is a deliberate exception to that convention rather than an
# oversight — renaming it to codecov.yaml silently restores the defaults below.
#
# Both statuses are informational because coverage is already gated, by the
# thresholds in vite.config.ts, and those are a floor with a margin under it.
# Codecov's default project status is a different question: it fails a pull
# request that lowers coverage against its base by any amount at all. Branch
# coverage here moves from run to run on identical code — the watcher cases
# take different paths depending on what the filesystem reports and when, which
# is the swing the margin under those thresholds is sized for — so that default
# would fail pull requests that changed nothing. informational keeps the number
# reported and leaves the floor in vite.config.ts as the one thing a drop has
# to clear.
coverage:
  status:
    patch:
      default:
        informational: true
    project:
      default:
        informational: true

# The bundle status is informational for a different reason than the two above,
# and the reason is that the number cannot be made to mean what a bundle alert
# is for. `codecovRollupPlugin` reads the rolldown bundle in `generateBundle`
# and measures every chunk and asset in it except source maps — and tsdown runs
# `rolldown-plugin-dts` inside that same build, so the declarations are chunks
# in it. Measured at 7f32dc0: `dist/types.d.ts` is 16,725 bytes, of which 93.8%
# is JSDoc, and it is 33.3% of the 50,234 bytes the plugin sees.
#
# `src/types.ts` is the options contract, and the README's Options Reference is
# generated from it — so that documentation is meant to grow. Against the
# default 5% threshold, roughly 2.5KB of new JSDoc trips a size alert while
# changing the shipped JavaScript by nothing.
#
# The plugin has no option to exclude an asset, so the measurement cannot be
# narrowed to runtime weight; the choice is what the alert does about it.
# Informational keeps the number reported on every pull request and stops it
# reading as a failure for a documentation change. It is deliberately not a
# required check either — ruleset 19123565 names Build, Lint and Test, and a
# size figure is a prompt to look rather than a gate.
#
# `warning_threshold` is deliberately not set. The default is 5%, and no other
# number here would be measured — it would be a guess about how much growth is
# acceptable in a bundle that is one third documentation.
bundle_analysis:
  status: informational
